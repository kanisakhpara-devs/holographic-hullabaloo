; Rotor firmware: runs on the hub PCB (ESP32-S3-WROOM-1-N8, no PSRAM).
[env:rotor]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv   ; 3.3 MB app slot, the faces add about 0.5 MB
; Face data from software/tools/face/rebake_led.py, baked into the firmware (one upload, no file system).
; face.cpp reads them through the _binary_data_..._start / _end symbols the linker makes.
board_build.embed_files =
  data/faces.bin
  data/base_back.bin
build_flags =
  -I ../shared
  -D ARDUINO_USB_CDC_ON_BOOT=1   ; Serial goes over the native USB-C port
